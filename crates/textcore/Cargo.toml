[package]
name = "datara-textcore"
version = "0.1.0"
edition = "2021"
description = "Text core for Datara Studio: rope-lite document, incremental line index, Datara lexer. Compiled to wasm32."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
