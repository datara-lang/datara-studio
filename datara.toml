[package]
name = "ryan_harness_core"
version = "0.1.0"
edition = "2026"
description = "Ryan Harness Core - a headless, provider-first IDE kernel written in Datara"
authors = ["Ryan Harness Core contributors"]
entry = "src/main.dtr"

[dependencies]
# The kernel itself has ZERO external package dependencies.
# Optional adapters declare theirs locally (see adapters/*/datara.toml).

[target]
bin_name = "ryan"
opt_level = "release"

[profiles.release]
opt_level = "3"
lto = true

[profiles.domain]
opt_level = "domain"
pgo = true
lto = true
