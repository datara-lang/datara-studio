name: release

# Build the installers for every platform and attach them to the release.
#
# Why this exists. Release v0.3.0 carries exactly one asset,
# `Datara.Studio_0.3.0_x64-setup.exe`. The bundle config has listed `deb` and
# `appimage` for a while and there was still no Linux build, because a target
# list is not a build: nothing ever ran `cargo tauri build` anywhere except one
# Windows machine. A Linux or macOS user had nothing to download.
#
# Two further things were wrong and are fixed here or alongside:
#
#   * `bundle.targets` had no macOS entry at all, so even a macOS build would
#     have produced no installer. It lists `app` and `dmg` now. Targets that do
#     not apply to the current platform are skipped by the bundler with a
#     warning - it does not fail - so one list can serve all three.
#   * The `--bundles` flag is validated against the host platform and rejects
#     anything else, so each job passes only its own formats. Measured:
#     `cargo tauri build --bundles nsis,deb,appimage,app,dmg` on Windows exits
#     with `invalid value 'deb' for '--bundles'`.
#
# And three more were found by running this workflow's own steps against a fresh
# checkout - `git archive HEAD` into an empty directory, which is exactly the set
# of files a runner gets:
#
#   * `ui/vendor/textcore.js` is gitignored and generated by
#     `scripts/build-wasm.mjs`, and `build-ui.mjs` **inlines** it. Without the
#     wasm32 target installed and that build run first, the interface step dies on
#     `cannot inline /vendor/textcore.js`. Measured, verbatim, on a fresh
#     checkout. This was the first thing the workflow would have done.
#   * Nothing in the repository installed the Tauri CLI, because the local builds
#     ran on a machine that happened to have `tauri-cli` installed. On a runner
#     `cargo tauri build` fails with "no such command: tauri".
#   * The npm CLI provides `tauri`, not `cargo-tauri` - `npm view
#     @tauri-apps/cli@2 bin` reports `{"tauri": "tauri.js"}` and nothing else - so
#     the build step invokes `tauri`, not `cargo tauri`.
#
# macOS is built universal (arm64 + x86_64) rather than for the runner's own
# architecture. A `macos-latest` runner is Apple Silicon, so a default build
# would produce a dmg that does not open on an Intel Mac - which is exactly the
# kind of half-a-platform release this workflow is meant to stop.
#
# What the installers do NOT contain: forgen. The studio is a compiler-native
# IDE - the shell starts the Datara server, which compiles `src/main.dtr` - and
# forgen is a separate product with no public download yet. The installers ship
# the shell, the studio sources and the built interface, and they need forgen on
# PATH to run. The README says so; this comment says so because a release page
# that does not is how a bug report about "it opens a grey window" starts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and attach installers to"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: ""
            bundles: nsis
            # One glob per line: `upload-artifact` takes a newline-separated list,
            # and a space-separated one is read as a single path that matches
            # nothing. The shell loop below splits on whitespace either way.
            assets: |
              src-tauri/target/release/bundle/nsis/*.exe

          - name: Linux x64
            os: ubuntu-22.04
            target: ""
            bundles: deb,appimage
            assets: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
            assets: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fail before spending ten minutes building, and fail for the reason that
      # matters here: this workflow names every asset after the **tag**, while
      # `tauri.conf.json` names the installer and `src/api.dtr` is what the
      # running server reports. `ci.yml` does not run on tag pushes, so this is
      # the only place the tag is ever compared with the tree - and a release
      # whose download disagrees with the binary inside it is exactly the kind of
      # thing nobody notices until a bug report.
      - name: The tag and the tree agree on the version
        run: node scripts/verify-version.mjs

      # The wasm target is not optional. `ui/vendor/textcore.js` is generated by
      # `scripts/build-wasm.mjs`, it is gitignored, and `build-ui.mjs` inlines it
      # - so without this target and without that build, the interface step dies
      # on `cannot inline /vendor/textcore.js`. Measured on a fresh checkout
      # (`git archive HEAD` into an empty directory): exactly that error, on
      # every platform. The step order below is the fix.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # `cargo tauri` is a subcommand, not part of cargo, and nothing in this
      # repository installed it - the local builds worked because tauri-cli 2.11.4
      # happens to be installed on the machine that ran them. On a runner,
      # `cargo tauri build` fails with "no such command: tauri".
      #
      # The npm package rather than `cargo install tauri-cli`, which compiles the
      # CLI from source and takes minutes; this ships a prebuilt binary. It
      # provides `tauri` and **not** `cargo-tauri` - checked with
      # `npm view @tauri-apps/cli@2 bin`, which reports `{"tauri": "tauri.js"}`
      # and nothing else - so the build step below invokes `tauri`, not
      # `cargo tauri`. The two are not interchangeable on PATH.
      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Add both macOS architectures
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Tauri v2 on Linux, from the documented dependency list. Without these the
      # bundler fails at the point it links the webview, which reads as a Rust
      # error rather than a missing system package.
      - name: Install the Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libxdo-dev libssl-dev libfuse2 \
            build-essential curl wget file

      # The interface and the icons are build inputs, not checked-in files:
      # `ui/studio.html` is a bundled resource, `src-tauri/icons/` is gitignored
      # and `assets/datara.ico` is what the file association uses. The text core
      # comes first because the interface inlines it.
      - name: Build the interface and the icons
        run: |
          node scripts/build-wasm.mjs
          node scripts/build-icons.mjs
          node scripts/build-ui.mjs
          node scripts/build-ui.mjs --core

      # The shell's own tests, before anything is bundled.
      #
      # This step exists because of the release it would have stopped. v0.5.0's
      # installers were built, uploaded and downloaded by real users, and none of
      # them could start: the shell looked for the studio's sources in
      # `resources/studio` while `bundle.resources` creates `studio`, so it fell
      # through to the working directory, ran `forgen run src/main.dtr` in a
      # directory with no `src/`, and the window sat on "the interface server is
      # not answering". Every check in the repository passed, because every check
      # looked at the repository layout - which is the one layout that worked.
      #
      # These tests build their fixture from `bundle.resources` in
      # `tauri.conf.json` and assert the shell resolves what the bundler
      # declares, on the layout of each of the three platforms this matrix
      # builds. `cargo test` also runs in `ci.yml`, but `ci.yml` does not run on
      # a tag push - so without this step a release could still be cut from a
      # tree that no test had looked at.
      - name: The shell's own tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Bundle
        shell: bash
        run: |
          set -euo pipefail
          args=(--bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
          fi
          tauri build "${args[@]}"
      # Collect the installers as an array, not by looping over the globs.
      #
      # `for f in $ASSETS` is wrong twice over: the outer expansion globs, so the
      # loop variable holds the *filename*, and the next unquoted expansion then
      # splits it - and the Windows installer is called `Datara Studio_0.3.0_...`,
      # with a space in it. Measured here: that turned one file into two words,
      # `Datara` and `Studio_0.3.0_x64-setup.exe`, and the step died on a path
      # that does not exist. `while read` neither word-splits nor globs, so the
      # pattern survives to the one place it is wanted.
      - name: List what came out
        shell: bash
        env:
          ASSETS: ${{ matrix.assets }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            files+=($pattern)
          done <<< "$ASSETS"
          for f in "${files[@]}"; do ls -l "$f"; done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no installer was produced for ${{ matrix.name }}" >&2
            exit 1
          fi

      - name: Keep the installers for this run
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

      # `gh` is on every runner, so the release is created or updated with the
      # token the workflow already has rather than through another action.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ASSETS: ${{ matrix.assets }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Datara Studio $TAG" \
              --notes "Installers for Windows, Linux and macOS.

          The studio needs the **forgen** compiler on PATH: it is a compiler-native
          IDE, and the shell starts the Datara server that compiles \`src/main.dtr\`.
          See the README for the per-platform install steps."
          fi
          files=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            files+=($pattern)
          done <<< "$ASSETS"
          for f in "${files[@]}"; do gh release upload "$TAG" "$f" --clobber; done
          gh release view "$TAG" --json assets --jq '.assets[].name'
